<style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const VERSION='v4';
/* ---------- timer (shared) ---------- */
const TM={on:true,left:0,secs:15,copper:5,t0:0,iv:null,key:null,onUp:null,
  start(key,secs,copper,onUp){if(!this.on){this.hide();return}if(this.key===key&&this.iv)return;this.stop();this.key=key;this.secs=secs;this.copper=copper;this.onUp=onUp;this.t0=performance.now();this.build();this.draw(secs);
    this.iv=setInterval(()=>{const l=this.secs-(performance.now()-this.t0)/1000;this.draw(l);if(l<=0){this.stop();const f=this.onUp;this.onUp=null;if(f)f()}},100)},
  elapsed(){return Math.min(this.secs,(performance.now()-this.t0)/1000)},
  stop(){if(this.iv){clearInterval(this.iv);this.iv=null}},
  hide(){this.stop();this.key=null;const b=document.getElementById('tbar');if(b)b.remove();document.body.classList.remove('timed')},
  build(){let b=document.getElementById('tbar');const phone=document.documentElement.classList.contains('phone');const blocks=Math.round(this.secs/5);const per=(phone&&this.secs>15)?1:5;
    const sig=blocks+'x'+per;if(b&&b.dataset.sig===sig)return;if(b)b.remove();b=document.createElement('div');b.id='tbar';b.className='tbar';b.dataset.sig=sig;b.setAttribute('role','timer');b.setAttribute('aria-label','Time left for this question');
    b.innerHTML=`<div class="in"><div class="segs">${Array.from({length:blocks},()=>`<div class="grp">${'<i class="sg"></i>'.repeat(per)}</div>`).join('')}</div><div class="tnum"></div></div>`;document.body.appendChild(b);document.body.classList.add('timed')},
  draw(l){const b=document.getElementById('tbar');if(!b)return;const segs=b.querySelectorAll('.sg');const sps=this.secs/segs.length;const n=Math.max(0,Math.ceil(l/sps-1e-9));const warn=l<=this.copper;
    segs.forEach((s,i)=>{s.classList.toggle('off',i>=n);s.classList.toggle('cu',warn&&i<n)});const t=b.querySelector('.tnum');t.classList.toggle('cu',warn);t.innerHTML=`${Math.max(0,Math.ceil(l))}<small>s</small>`},
  fmt(s){s=Math.round(s);return s<60?`${s} second${s===1?'':'s'}`:`${Math.floor(s/60)} min ${s%60} s`},
  summary(right,total,secs){return this.on?`<div class="tsum"><b>${right}/${total} in ${this.fmt(secs)}</b> · ${this.left?`left the page ${this.left} time${this.left===1?'':'s'}`:'stayed on the page throughout'}</div>`:''},
  menuRow(note){return `<div class="label">Timer</div><div class="opts"><button class="opt ${this.on?'on':''}" onclick="setTimerOpt(true)">⏱ Timed<small>${note}</small></button><button class="opt ${this.on?'':'on'}" onclick="setTimerOpt(false)">No timer<small>Take your time</small></button></div>`}};
try{const v=localStorage.getItem('timer_on');if(v!==null)TM.on=v==='1'}catch(e){}
window.setTimerOpt=v=>{TM.on=v;try{localStorage.setItem('timer_on',v?'1':'0')}catch(e){}render()};

function pins(sc,items,K){const boxes=[];let out='';const W=sc.w,H=sc.h;const z=20*K;

  pts.forEach(o=>{const [x,y]=o.p.xy;boxes.push({x0:x-5,x1:x+5,y0:y-5,y1:y+5})});
  const hit=b=>b.x0<2||b.y0<2||b.x1>W-2||b.y1>H-2||boxes.some(o=>!(b.x1<o.x0||b.x0>o.x1||b.y1<o.y0||b.y0>o.y1));
  for(const o of pts){const [x,y]=o.p.xy;let best=null;
    outer:for(const r of [22,32,44,58,74,92].map(v=>v*K)){for(const a of [-45,-135,45,135,0,180,-90,90]){const rad=a*Math.PI/180;const cx=x+Math.cos(rad)*r,cy=y+Math.sin(rad)*r;
      const b={x0:cx-z/2-2,x1:cx+z/2+2,y0:cy-z/2-2,y1:cy+z/2+2};if(!hit(b)){best={cx,cy,b};break outer}}}
    if(!best)best={cx:x+22*K,cy:y-22*K,b:{x0:x+22*K-z/2,x1:x+22*K+z/2,y0:y-22*K-z/2,y1:y-22*K+z/2}};boxes.push(best.b);
    out+=`<circle cx="${x}" cy="${y}" r="${4.5*K}" fill="none" stroke="#e2552d" stroke-width="${2*K}"/><line x1="${x}" y1="${y}" x2="${best.cx.toFixed(1)}" y2="${best.cy.toFixed(1)}" stroke="#e2552d" stroke-width="${1.4*K}"/><g transform="translate(${best.cx.toFixed(1)},${best.cy.toFixed(1)})"><rect x="${-z/2}" y="${-z/2}" width="${z}" height="${z}" rx="${z*.22}" fill="url(#cu${uid})" stroke="#7a3c1c"/><text class="rlp" font-size="${z*.62}" text-anchor="middle" dominant-baseline="central">${o.it.L.toUpperCase()}</text></g>`}
  return out}

  const slots=R.slots.map((Lt,i)=>i===0?`<div class="slot fixed"><span class="ord">1st</span><span class="fill"><span class="plate">A</span><b>${esc(byL.a.n)}</b><span class="given">${M.first} · given</span></span></div>`
    :`<button class="slot ${Lt?'full':''}" onclick="unslot(${i})"><span class="ord">${ORD[i]}</span><span class="fill">${Lt?`<span class="plate">${Lt.toUpperCase()}</span><b>${esc(byL[Lt].n)}</b><span class="x">✕</span>`:'<span class="empty">tap a lake below</span>'}</span></button>`).join('');
  const tiles=R.items.filter(x=>x.L!=='a').sort((a,b)=>a.L.localeCompare(b.L)).map(x=>`<button class="tile ${R.slots.includes(x.L)?'used':''}" onclick="place('${x.L}')"><span class="plate">${x.L.toUpperCase()}</span>${esc(L(x.id).n)}</button>`).join('');
  const cards=`<div class="lcards ${n===3?'n3':''}">${R.items.slice().sort((a,b)=>a.L.localeCompare(b.L)).map(x=>lakeCard(L(x.id),x.L)).join('')}</div>`;
  return `<div class="play"><div class="top"><h1>Lakes</h1><div class="row">${S.cur>0&&!TM.on?'<button class="link" onclick="back()">← Previous</button>':''}<button class="link" onclick="quit()">Quit</button></div></div>
  <div class="prog">${prog}</div>
  <div class="q">${phone?'':'Rank these lakes · '}<em>${esc(sc.name)}</em>${pill(R.metric)}<span>Round ${S.cur+1} of ${S.game.length} · the ${M.first} is given, you rank the rest</span></div>
  <div class="board"><div class="lcol"><div class="mapcard"><div class="cname">${esc(sc.name)}</div>${mapSVG(sc,R.items,phone?1.6:1)}</div>${cards}</div>
  <div class="rank"><div class="label">${M.head}</div><div class="slots">${slots}</div><div class="label">Lakes to place</div><div class="tray">${tiles}</div>
  <button class="btn" onclick="lock()" ${full?'':'disabled'}>${full?'Lock in answer':'Fill every box to lock in'}</button>
  <div class="kbd">Keys ${LET.slice(1,n).toUpperCase().split('').join(' ')} place a lake · Backspace removes · Enter locks in</div></div></div></div>`}
window.place=Lt=>{const R=S.game[S.cur];if(R.slots.includes(Lt))return;const i=R.slots.indexOf(null);if(i<0)return;R.slots[i]=Lt;render(true)};
window.unslot=i=>{const R=S.game[S.cur];if(i>0&&R.slots[i]){R.slots[i]=null;render(true)}};
window.lock=()=>{const R=S.game[S.cur];if(!R.slots.every(Boolean)||R.done)return;if(TM.on){R.done=true;R.secs=TM.elapsed();TM.stop()}advance()};
window.back=()=>{if(S.cur>0){S.cur--;render()}};window.quit=()=>{TM.hide();S.screen='menu';render()};
addEventListener('keydown',e=>{if(S.screen!=='play')return;const R=S.game[S.cur];const k=e.key.toLowerCase();
  if(k.length===1&&LET.indexOf(k)>0&&R.items.some(x=>x.L===k))place(k);
  else if(k==='backspace'){e.preventDefault();for(let i=R.slots.length-1;i>0;i--)if(R.slots[i]){R.slots[i]=null;render(true);break}}
  else if(k==='enter'){e.preventDefault();lock()}});

/* ---------- results ---------- */
function gauge(truth){const max=truth[0].v;const n=truth.length,w=620,col=w/n;
  return `<svg viewBox="0 0 ${w} 280" class="gauge"><rect width="${w}" height="280" fill="#eef3f6"/><line x1="0" y1="36" x2="${w}" y2="36" stroke="#5c7f94" stroke-width="2"/>
  ${truth.map((t,i)=>{const h=Math.max(3,t.v/max*200);const x=i*col+col*.18,bw=col*.64;return `<rect x="${x}" y="36" width="${bw}" height="${h}" rx="4" fill="${i===0?'#b8663a':'#2f4a5a'}"/><text x="${x+bw/2}" y="${36+h+17}" text-anchor="middle" class="gn">${fmt(t.v)} m</text><text x="${x+bw/2}" y="26" text-anchor="middle" class="gt2">${t.L.toUpperCase()} · ${esc(t.l.n.replace(/^Lake /,''))}</text>`}).join('')}</svg>`}
function sameScale(truth,cols,cls){const m=Math.min(...truth.map(t=>t.l.s));const rows=Math.ceil(truth.length/cols);
  return `<svg class="scale ${cls}" viewBox="0 0 ${cols*150} ${rows*175}">${truth.map((t,k)=>{const x=(k%cols)*150+75,y=Math.floor(k/cols)*175;const f=m/t.l.s*0.66*150/160;
    return `<g transform="translate(${x},${y+80}) scale(${f}) translate(-80,-80)"><path d="${t.l.d}" fill="${k===0?'#b8663a':'#16130f'}"/></g><text x="${x}" y="${y+166}" text-anchor="middle">${t.L.toUpperCase()} · ${esc(t.l.n)}</text>`}).join('')}</svg>`}
function verdict(p){return p===1?'Perfect. A true lake expert.':p>=.8?'Excellent. You know your lakes.':p>=.6?'Solid effort. A few surprises in there.':p>=.4?'The lakes have fooled you a bit.':'Lakes can be very deceptive!'}
function resultsHTML(){let right=0,total=0,surprise=null;const cards=[];
  S.game.forEach((R,ri)=>{const sc=BYID[R.sc],M=METRICS[R.metric];const truth=R.items.map(x=>({L:x.L,l:L(x.id),v:L(x.id)[R.metric]})).sort((a,b)=>b.v-a.v);const max=truth[0].v;let rr=0;
    const rows=truth.map((t,i)=>{const mine=R.items.find(x=>x.L===R.slots[i]);const ok=!!mine&&mine.L===t.L;if(i>0){total++;if(ok){right++;rr++}else{const pos=R.slots.indexOf(t.L);const err=Math.abs(pos-i);if(pos>=0&&(!surprise||err>surprise.err))surprise={err,t,pos,i,M,sc}}}
      return `<div class="rr"><span class="ord">${ORD[i]}</span><span class="plate">${t.L.toUpperCase()}</span><div class="rb"><div class="rn"><b>${esc(t.l.n)}</b><span>${fmt(t.v)} ${M.unit}</span></div><div class="bar"><i class="${i===0?'cu':''}" style="width:${(t.v/max*100).toFixed(1)}%"></i></div></div>${i===0?'<span class="st gv">Given</span>':ok?'<span class="st ok">✓ You had it</span>':mine?`<span class="st no">✗ You put ${esc(L(mine.id).n)}</span>`:'<span class="st no">⏱ Not placed</span>'}</div>`}).join('');
    let fact;let cp=null;for(let i=1;i<truth.length;i++){const g=truth[i-1].v-truth[i].v;if(!cp||g/truth[i].v<cp.g/cp.b.v)cp={g,a:truth[i-1],b:truth[i]}}
    const big=truth.find(t=>t.l.area);const deep=truth.slice().sort((a,b)=>(b.l.depth||0)-(a.l.depth||0))[0];
    if(R.metric==='depth'&&big&&truth.some(t=>t.l.area&&t.l.area>big.l.area)===false&&big!==truth[0]&&big.l.area)fact=`💡 ${esc(big.l.n)} is the biggest of these by area, but not the deepest.`;
    else if(cp.g/cp.b.v<0.12)fact=`💡 ${esc(cp.a.l.n)} beats ${esc(cp.b.l.n)} by just ${fmt(Math.round(cp.g*10)/10)} ${M.unit}.`;
    else fact=`💡 ${esc(truth[0].l.n)} is ${(truth[0].v/truth[truth.length-1].v).toFixed(1)}× ${R.metric==='depth'?'as deep as':R.metric==='area'?'the size of':'as long as'} ${esc(truth[truth.length-1].l.n)}.`;
    const srcs=[...new Set(truth.map(t=>t.l.src[R.metric]))];
    const visual=R.metric==='depth'?gauge(truth):R.metric==='area'?sameScale(truth,5,'s5')+sameScale(truth,3,'s3'):'';
    cards.push(`<div class="rcard"><div class="rhd"><div><div class="label" style="margin:0">Round ${ri+1} · ${esc(sc.name)} · ${M.icon} by ${R.metric}</div><h3>${M.noun[0].toUpperCase()+M.noun.slice(1)} lakes${R.metric==='area'?', drawn to the same scale':''}</h3></div><div class="rs">${rr}/${truth.length-1}</div></div>${TM.on&&R.secs!=null?`<div class="tstat">${R.timedOut?'Time ran out':'Answered in '+R.secs.toFixed(1)+' s'}</div>`:''}
     ${visual}${R.metric==='depth'?'<div class="gcap">Bars hang down from the water surface to each lake\'s deepest point.</div>':''}${rows}<div class="fact">${fact}</div><div class="srcline">Figures from ${srcs.map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>`).join(' and ')}</div></div>`)});
  const sp=surprise?`<div class="surprise">😲 <b>Biggest surprise:</b> you put ${esc(surprise.t.l.n)} ${ORD[surprise.pos]}, but by ${surprise.M.t.toLowerCase()} (${fmt(surprise.t.v)} ${surprise.M.unit}) it's ${ORD[surprise.i]}.</div>`:`<div class="surprise">🎯 Every lake in the right place. Remarkable!</div>`;
  return `<h1>Results</h1><div class="panel"><div class="score"><div class="big">${right}/${total}</div><div><h2>${verdict(right/total)}</h2>${TM.summary(right,total,S.game.reduce((s,r)=>s+(r.secs||0),0))}<div style="color:var(--muted);font-size:14px">Natural Wonders · Lakes · ${WHERE[S.where].t.replace(/^\S+ (?=[A-Z])/,'')} · ${RANKBY[S.rankby].t} · ${S.game.length} rounds</div></div></div>
  ${sp}<div class="row" style="margin-top:16px"><button class="btn" onclick="startGame()">Play again</button><button class="btn ghost" onclick="quit()">Change settings</button><button class="btn ghost" onclick="share(${right},${total})">Share score</button><button class="btn ghost" onclick="openSources()">Sources</button><a class="btn ghost" href="https://jmcpublic.github.io/">More games</a></div></div>
  <div class="label" style="margin-top:24px">Round by round</div>${cards.join('')}<p class="foot">Every figure is shown exactly as published by the source named under each round. <button class="srclink" onclick="openSources()">See all sources</button></p>`}
window.share=async(r,n)=>{const t=`Natural Wonders: Lakes. I scored ${r}/${n}. Can you beat me?`;const u=location.href.startsWith('http')?location.href:'';
  try{if(navigator.share){await navigator.share({text:t,url:u||undefined});return}}catch(e){return}
  try{await navigator.clipboard.writeText(t+(u?' '+u:''));toast('Score copied. Paste it to a friend.')}catch(e){toast(t)}};
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3800)}
function openSources(){let ov=document.getElementById('srcov');if(!ov){ov=document.createElement('div');ov.id='srcov';ov.className='srcov';ov.addEventListener('click',e=>{if(e.target===ov)closeSources()});document.body.appendChild(ov)}
 ov.innerHTML=`<div class="srcbox" role="dialog" aria-label="Sources"><button class="srcx" onclick="closeSources()">Close</button>${sourcesBody()}</div>`;ov.classList.add('open');ov.scrollTop=0}
function closeSources(){const ov=document.getElementById('srcov');if(ov)ov.classList.remove('open')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeSources()});

function sourcesBody(){const cell=(l,m)=>l[m]==null?'<td class="n">–</td>':`<td class="n">${fmt(l[m])}</td>`;
  const rows=LAKES.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(l=>`<tr><td>${esc(l.n)}</td>${cell(l,'area')}${cell(l,'depth')}${cell(l,'length')}<td>${[...new Set(Object.values(l.src))].map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${k==='A'?'Lakes by area':k==='D'?'Lakes by depth':'Largest lakes of Europe'}</a>`).join(', ')}</td></tr>`).join('');
  return `<h2>Sources</h2>
  <p class="gf">The lake figures in this game were taken in good faith from the published sources below in October 2026, and each figure is shown exactly as that source gives it. Lake areas change with the seasons and with rainfall, depths come from surveys of different ages, and reputable sources often disagree, so you may find other figures elsewhere, and a source can occasionally be wrong. If you think a figure is wrong, the source named next to it is where it came from.</p>
  <h3>How the game stays fair</h3><ul><li>Each round says what you're ranking: area (surface area), depth (deepest point) or length (end to end).</li><li>Lakes whose figures are within about 5% of each other never appear in the same round, so a different source could not change the right answer.</li><li>A lake only appears in rounds for measures its source gives a figure for.</li></ul>
  <h3>Lake figures</h3><ul>${Object.entries(SRC).map(([k,v])=>`<li><a href="${v[1]}" target="_blank" rel="noopener">${esc(v[0])}</a></li>`).join('')}</ul>
  <h3>Maps</h3><ul><li>Lake and country outlines: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> (public domain). Outlines are simplified, so a lake's size on the map is only a rough guide.</li></ul>
  <h3>Every lake and its figures</h3><details><summary>${LAKES.length} lakes · area km² · depth m · length km</summary><table><tr><td><b>Lake</b></td><td class="n"><b>Area</b></td><td class="n"><b>Depth</b></td><td class="n"><b>Length</b></td><td><b>Source</b></td></tr>${rows}</table></details>
  <p style="font-size:12px;color:#6f685d;margin-top:14px">Natural Wonders: Lakes ${VERSION}</p>`}
render();
</script>
</body>
</html>
